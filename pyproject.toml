[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedycpu"
version = "0.1.0"
description = "SpeedyCPU - a command-line CPU responsiveness booster. One command on, one command off."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-2.0-or-later" }
authors = [{ name = "SpeedyCPU contributors" }]
keywords = ["cpu", "performance", "priority", "latency", "scheduler", "cli", "windows", "booster"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Library or Lesser General Public License (LGPL)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Java",
    "Programming Language :: C++",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
# SpeedyCPU deliberately has ZERO runtime dependencies: everything is stdlib +
# hand written ctypes bindings. That keeps the frozen binary small and means
# `pip install speedycpu` never pulls in a supply-chain surprise.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "build>=1.2", "pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/speedycpu/speedycpu"
Documentation = "https://github.com/speedycpu/speedycpu#readme"
Source = "https://github.com/speedycpu/speedycpu"
Issues = "https://github.com/speedycpu/speedycpu/issues"
Changelog = "https://github.com/speedycpu/speedycpu/blob/main/CHANGELOG.md"

[project.scripts]
s-cpu = "speedycpu.cli:main"
speedycpu = "speedycpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speedycpu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines: docstrings and tables read better unwrapped
    # The Chinese catalog deliberately uses full-width punctuation (（）：，)
    # and curly quotes. They are the correct typography for that language, but
    # RUF001-003 cannot tell them apart from a typo'd ASCII character.
    "RUF001",
    "RUF002",
    "RUF003",
    # `handle = open(...); Popen(..., stdout=handle); handle.close()` is
    # intentional: the handle must outlive the Popen call.
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
# ctypes bindings mirror the Win32 names verbatim, capitals and all.
"src/speedycpu/backends/winapi.py" = ["N801", "N802", "E741"]
# Tests assert on behaviour, so a few long parametrise tables are fine.
"tests/*" = ["SIM117"]
